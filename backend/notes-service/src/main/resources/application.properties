spring.application.name=notes-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/notes_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.session.store-type=redis
spring.session.redis.namespace=student-hub:session
spring.session.timeout=${SESSION_TIMEOUT:1d}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
server.servlet.session.cookie.name=STUDENT_HUB_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax